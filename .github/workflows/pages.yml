# Builds the site from site/ plus data from the game repository
# (lombyte-project/lombyte: logo, latest commits, progress report) and deploys
# it to GitHub Pages. Runs on every push here, after each progress publish on the game main, hourly
# and on demand.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [progress-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: site-src
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lombyte-project/lombyte
          ref: main
          path: game
          fetch-depth: 0
      - name: Build
        working-directory: game
        run: |
          git fetch --depth=1 origin progress
          mkdir -p build/progress
          git show FETCH_HEAD:report.json > build/progress/report.json
          pip install pillow
          python3 ../site-src/build_site.py build/progress
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: game/build/site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      # Tell Bing (and other IndexNow engines) the page changed. The key file
      # site/<key>.txt proves ownership. Skipped on the hourly run.
      - name: Ping IndexNow
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          curl --fail -sS -o /dev/null -w "IndexNow %{http_code}\n" \
            "https://api.indexnow.org/indexnow?url=https://lombyte-project.github.io/&key=804a690346734f7ec4bbab2ca91b3143"
